[project]
name = "cli-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "jsonschema>=4.21",
    "mcp",
    "python-dotenv>=1.2.2",
    "strictyaml>=1.7.3",
]

[project.scripts]
cli-agent = "cli_agent.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
