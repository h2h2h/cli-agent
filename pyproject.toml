[project]
name = "cli-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiodocker>=0.27.0",
    "httpx",
    "jsonschema>=4.21",
    "mcp",
    "prompt-toolkit>=3.0.47,<4",
    "python-dotenv>=1.2.2",
    "rich>=15",
    "strictyaml>=1.7.3",
    "tree-sitter>=0.23",
    "tree-sitter-bash>=0.23",
]

[project.scripts]
cli-agent = "cli_agent.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not live_sync and not docker'"
markers = [
    "live_sync: run a real uv dependency synchronization instead of mocking it",
    "docker: run against a real Docker daemon; skipped when it is unavailable",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
