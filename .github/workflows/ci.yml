name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run pytest tests -m "not live_sync"

  docker:
    name: docker backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - name: pull the Docker execution image
        run: docker pull python:3.12-alpine
      - name: run the full suite against the Docker daemon
        run: uv run pytest tests -m "not live_sync"
